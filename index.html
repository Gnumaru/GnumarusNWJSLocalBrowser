<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NW.js Local Browser</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="app">
    <div id="picker">
      <p>Select a directory or HTML file to serve:</p>
      <button id="btnChoose" type="button">Choose Directory</button>
      <input id="dirInput" type="text" placeholder="/path/to/directory-or-file.html" size="60" />
      <button id="btnStart" type="button">Start</button>
    </div>

    <div id="status" class="hidden"></div>
  </div>

  <script src="dist/shell.js"></script>
</body>
</html>
